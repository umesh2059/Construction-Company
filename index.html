<!doctype html>
<html lang="en">
  <head>
    <!-- Basic -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title -->
    <title>
      Susta Construction | Building Construction & Engineering Company
    </title>

    <!-- SEO -->
    <meta
      name="description"
      content="Susta Construction is a trusted construction and engineering company offering residential, commercial, and infrastructure construction services with quality and innovation."
    />

    <meta
      name="keywords"
      content="construction company, engineering, building contractor, residential construction, commercial construction, infrastructure, Nepal construction"
    />

    <meta name="author" content="Susta Construction" />
    <meta name="robots" content="index, follow" />

    <!-- Theme -->
    <meta name="theme-color" content="#0F172A" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Canonical -->
    <link rel="canonical" href="https://www.sustaconstruction.com/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Susta Construction" />
    <meta
      property="og:title"
      content="Susta Construction | Engineering & Construction Services"
    />
    <meta
      property="og:description"
      content="Professional construction services for residential, commercial, and infrastructure projects."
    />
    <meta property="og:url" content="https://www.sustaconstruction.com/" />
    <meta
      property="og:image"
      content="https://www.sustaconstruction.com/og-image.jpg"
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Susta Construction | Engineering & Construction"
    />
    <meta
      name="twitter:description"
      content="Trusted construction company delivering quality engineering and building solutions."
    />
    <meta
      name="twitter:image"
      content="https://www.sustaconstruction.com/og-image.jpg"
    />

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ConstructionCompany",
        "name": "Susta Construction",
        "url": "https://www.sustaconstruction.com",
        "logo": "https://www.sustaconstruction.com/logo.png",
        "description": "Professional construction company providing residential, commercial, and infrastructure services.",
        "telephone": "+977-XXXXXXXXXX",
        "address": {
          "@type": "PostalAddress",
          "addressCountry": "Nepal"
        }
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
